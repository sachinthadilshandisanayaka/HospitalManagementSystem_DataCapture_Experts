spring:
  application:
    name: clinic-appointment-api
  data:
    mongodb:
      uri: ${MONGO_URI}

server:
  port: 8080

app:
  security:
    api-key: ${API_KEY:clinic-secret-key}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: Clinic Appointment API
    description: RESTful API for managing clinic appointments, patients and practitioners
    version: 1.0.0

logging:
  level:
    co.clinic: DEBUG
    org.springframework.data.mongodb: INFO
